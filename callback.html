<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Conectando Instagram...</title>
  <style>
    body { background-color: #0d1320; color: #6bd8cb; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
    .spinner { border: 4px solid rgba(107, 216, 203, 0.2); border-top: 4px solid #6bd8cb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Autenticando com a Meta, por favor aguarde...</p>

  <script>
    // Extract access_token from the URL hash
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    if (accessToken) {
      // Send it to our backend to save
      fetch('http://localhost:3001/api/auth/instagram/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessToken })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          // Redirect to the main app dashboard
          // Hack for our SPA to select dashboard on load
          window.location.href = '/?page=dashboard';
        } else {
          alert('Erro ao salvar token: ' + data.error);
          window.location.href = '/';
        }
      })
      .catch(err => {
        alert('Erro de conexão com o servidor.');
        window.location.href = '/';
      });
    } else {
      alert('Autenticação falhou ou token não retornado.');
      window.location.href = '/';
    }
  </script>
</body>
</html>
